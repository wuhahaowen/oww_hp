services:
  hass-panel:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "5123:5123"
      - "5124:5124"
    volumes:
      - ./data/hass-panel-dev:/config/hass-panel
      - ./backend:/backend  # 挂载后端代码以支持热重载
    environment:
      - NODE_ENV=development
      - DEBUG=1
    restart: unless-stopped
    # 使用国内镜像加速
    dns:
      - 8.8.8.8
      - 114.114.114.114