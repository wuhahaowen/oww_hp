version: '3.8'

services:
  hass-panel-local:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    ports:
      - "5123:5123"
      - "5124:5124"
    volumes:
      - ./data/hass-panel-local:/config/hass-panel
      - ./backend:/backend
    environment:
      - NODE_ENV=development
      - DEBUG=1
    restart: unless-stopped
    # 使用国内镜像加速
    dns:
      - 8.8.8.8
      - 114.114.114.114